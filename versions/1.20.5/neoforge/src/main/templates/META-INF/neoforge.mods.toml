modLoader="javafml"

loaderVersion="${loader_version_range}"

license="${mod_license}"

[[mods]]

modId="${mod_id}"

version="${mod_version}"

displayName="${mod_name}"
authors="Akis"
logoFile="icon.png"

description='''
Client-side minimap, world map and waypoints with a 2D and a 3D view of everything you have explored.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="proteus"
    type="required"
    versionRange="[1.2,)"
    ordering="NONE"
    side="BOTH"

[[mixins]]
config = "atlas.mixins.json"
